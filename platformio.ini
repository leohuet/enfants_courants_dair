; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@^7.0.1
platform_packages = 
	tool-esptoolpy@https://github.com/Jason2866/esptool/releases/download/v4.8.7/esptool.zip
board = seeed_xiao_esp32s3
framework = arduino
lib_ldf_mode = deep
lib_deps = 
	s00500/ESPUI@^2.2.4
	cnmat/OSC@^1.0.0
	arduino-libraries/Ethernet@2.0.1
	; ArduinoOTA=https://github.com/jandrassy/ArduinoOTA.git
monitor_speed = 115200
build_flags = 
	-DCORE_DEBUG_LEVEL=4
build_type = debug
monitor_filters = esp32_exception_decoder
src_filter = +<*.h> +<main-${PIOENV}.cpp>

[env:piedsouffle]

[env:toit]
; extra_scripts = post:extra_scripts.py
; upload_protocol = custom
; upload_flags =
;   http://arduino:question@192.168.68.101:3232/sketch
upload_protocol = espota
upload_flags =
  --auth=question
  --port=3232
upload_port = 192.168.68.101